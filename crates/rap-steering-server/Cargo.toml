[package]
name = "rap-steering-server"
publish = true
version = "0.1.0"
documentation = "https://docs.rs/rap-steering-server/"
description = "RAP tool server exposing project steering files to Infinity agents."
edition = "2024"
repository = { workspace = true }
license = "Apache-2.0"

[dependencies]
rap-protocol = { path = "../rap-protocol", version = "^0.1.0" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs", "signal", "sync"] }
axum = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4", features = ["derive"] }

[lints]
workspace = true
