[package]
name = "infinity-slack-bot"
publish = false
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "infinity-slack-bot"
path = "src/main.rs"

[dependencies]
infinity-protocol = { path = "../infinity-protocol" }
infinity-slack-dataflow = { path = "../infinity-slack-dataflow", features = ["stageleft_macro_entrypoint"] }

# `embedded_runtime` provides `hydro_lang::runtime_support::dfir_rs`, which the
# generated embedded dataflow (see `build.rs`) is expressed in terms of.
hydro_lang = { version = "0.17.0-alpha.2", default-features = false, features = ["embedded_runtime"] }
# Required by stageleft's staging machinery, which inspects this manifest when
# `build.rs` stages the dataflow.
stageleft = "0.15.0"

tokio = { workspace = true, features = ["full"] }
tokio-stream = { version = "0.1", default-features = false }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
bytes = "1"

[build-dependencies]
hydro_lang = { version = "0.17.0-alpha.2", default-features = false, features = ["build"] }
infinity-slack-dataflow = { path = "../infinity-slack-dataflow" }
prettyplease = { version = "0.2", features = ["verbatim"] }

[lints]
workspace = true
