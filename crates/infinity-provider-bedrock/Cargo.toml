[package]
name = "infinity-provider-bedrock"
publish = true
version = "0.1.0"
documentation = "https://docs.rs/infinity-provider-bedrock/"
description = "Native AWS Bedrock (Converse API) model provider for Infinity coding agents."
edition = "2024"
repository = { workspace = true }
license = "Apache-2.0"

[dependencies]
infinity-provider-protocol = { path = "../infinity-provider-protocol", version = "^0.1.0", features = ["remote"] }
aws-config = { workspace = true }
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-smithy-types = "1"
base64 = "0.22"
serde_json = { workspace = true }
async-trait = { workspace = true }
async-stream = "0.3"
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true

[features]
# Tests that talk to the real Bedrock service using your local AWS
# credentials: `cargo test -p infinity-provider-bedrock --features live-tests`.
live-tests = []

[dev-dependencies]
futures-util = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
