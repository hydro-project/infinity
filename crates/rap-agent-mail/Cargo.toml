[package]
name = "rap-agent-mail"
publish = true
version = "0.2.0"
documentation = "https://docs.rs/rap-agent-mail/"
description = "RAP tool server that lets Infinity agents message agents on other Infinity daemons."
edition = "2024"
repository = { workspace = true }
license = "Apache-2.0"

[dependencies]
rap-protocol = { path = "../rap-protocol", version = "^0.2.0" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "process", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { workspace = true, features = ["sink"] }
bytes = "1"
axum = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4", features = ["derive"] }
dirs = "6"
nix = { version = "0.31", features = ["fs", "signal", "hostname"] }

[dev-dependencies]
rap-client = { path = "../rap-client", version = "^0.2.0" }
tempfile = { workspace = true }

[lints]
workspace = true
