[package]
name = "infinity-rap-bridge"
publish = true
version = "0.1.0"
documentation = "https://docs.rs/infinity-rap-bridge/"
description = "Connect RAP tool servers to local Infinity agent systems."
edition = "2024"
repository = { workspace = true }
license = "Apache-2.0"

[dependencies]
infinity-agent-core = { path = "../infinity-agent-core", version = "^0.1.0" }
rap-client = { path = "../rap-client", version = "^0.1.0" }
rap-protocol = { path = "../rap-protocol", version = "^0.1.0" }
infinity-provider-protocol = { path = "../infinity-provider-protocol", version = "^0.1.0" }

serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "rt"] }

[dev-dependencies]
async-trait = { workspace = true }
tokio = { workspace = true, features = ["macros", "time"] }

[lints]
workspace = true
