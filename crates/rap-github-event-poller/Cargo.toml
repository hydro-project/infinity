[package]
name = "rap-github-event-poller"
publish = true
version = "0.1.0"
documentation = "https://docs.rs/rap-github-event-poller/"
description = "RAP tool server that polls GitHub and delivers repository events to Infinity agents as subscriptions."
edition = "2024"
repository = { workspace = true }
license = "Apache-2.0"

[dependencies]
rap-protocol = { path = "../rap-protocol", version = "^0.1.0" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
axum = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4", features = ["derive"] }

[lints]
workspace = true
