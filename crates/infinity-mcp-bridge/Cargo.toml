[package]
name = "infinity-mcp-bridge"
publish = true
version = "0.1.0"
documentation = "https://docs.rs/infinity-mcp-bridge/"
description = "Connect MCP servers to Infinity agent systems."
edition = "2024"
repository = { workspace = true }
license = "Apache-2.0"

[dependencies]
infinity-agent-core = { path = "../infinity-agent-core", version = "^0.1.0" }
rap-protocol = { path = "../rap-protocol", version = "^0.1.0" }
infinity-provider-protocol = { path = "../infinity-provider-protocol", version = "^0.1.0" }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "rt"] }
async-trait = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
