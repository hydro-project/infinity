[package]
name = "infinity-provider-protocol"
publish = true
version = "0.1.0"
documentation = "https://docs.rs/infinity-provider-protocol/"
description = "Extensible model provider abstraction and remote wire protocol for Infinity agents."
edition = "2024"
repository = { workspace = true }
license = "Apache-2.0"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
# Everything below is only pulled in by the `mock` / `remote` features.
async-stream = { version = "0.3", optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { version = "0.7", features = ["codec"], optional = true }
uuid = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
# Channel-driven mock completion model for tests (see the `mock` module).
mock = ["dep:tokio", "dep:async-stream"]
# Unix-socket transport for out-of-process providers (see the `remote`
# module). Currently unix-only; a Windows transport may join it later.
remote = [
    "dep:tokio",
    "tokio/net",
    "tokio/rt",
    "tokio/time",
    "dep:tokio-util",
    "dep:uuid",
    "dep:async-stream",
    "dep:tracing",
    "futures-util/sink",
]

[dev-dependencies]
# Self-dependency so this crate's own tests cover the feature-gated modules.
infinity-provider-protocol = { path = ".", features = ["mock", "remote"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
