[package]
name = "infinity-slack-dataflow"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "infinity_slack_dataflow"
path = "src/lib.rs"

[features]
# Forwarded to `hydro_lang` so the staged (`__staged`) module is emitted for
# consumers that compile the dataflow with `generate_embedded` (the CLI crate).
stageleft_macro_entrypoint = ["hydro_lang/stageleft_macro_entrypoint"]

[dependencies]
infinity-protocol = { path = "../infinity-protocol" }

hydro_lang = "0.17.0-alpha.2"
stageleft = "0.15.0"
ctor = "0.2"

serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

# Not used directly. Pins tokio's features for the sim-test dylib: Hydro's
# simulator compiles this crate into a dylib from a manifest derived from this
# Cargo.toml alone, while the host test binary gets the *workspace-unified*
# tokio features (e.g. `full` from infinity-slack-bot, `test-util` from
# infinity-agent-cli's dev-deps). If the two disagree, tokio's internals are
# laid out differently on each side of the dylib boundary — undefined behavior
# that manifested as a deterministic SIGSEGV in the sim tests on macOS CI.
# Keep this the union of every tokio feature enabled anywhere in the workspace.
# Remove once https://github.com/hydro-project/hydro/issues/3183 is fixed.
tokio = { workspace = true, features = ["full", "test-util"] }

[dev-dependencies]
hydro_lang = { version = "0.17.0-alpha.2", features = ["sim"] }
futures = "0.3"

[build-dependencies]
stageleft_tool = "0.15.0"

[lints]
workspace = true
